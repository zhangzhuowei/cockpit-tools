name: 🎁 Fork Release

# 自用 fork 的发布流程：推送 ultra-v<应用版本>-<序号> 形式的 tag（例如 ultra-v1.3.74-1）即触发。
# 走与 Build Matrix 相同的无签名构建，完成后直接公开 GitHub Release。
# 不使用作者的签名密钥，不生成 updater 产物，不修改 main 分支。
on:
  push:
    tags:
      - "ultra-v*"

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: "🔍 Validate tag"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔍 Tag must match package.json version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [[ ! "${GITHUB_REF_NAME}" =~ ^ultra-v([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)$ ]]; then
            echo "Tag ${GITHUB_REF_NAME} must look like ultra-v<version>-<n>, e.g. ultra-v${VERSION}-1"
            exit 1
          fi
          if [ "${BASH_REMATCH[1]}" != "${VERSION}" ]; then
            echo "Tag version ${BASH_REMATCH[1]} does not match package.json version ${VERSION}"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    name: "🏗️ Build: ${{ matrix.label }}"
    needs: validate
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - label: "macos-aarch64"
            platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            release_dir: "target/aarch64-apple-darwin/release"
          - label: "macos-x86_64"
            platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            release_dir: "target/x86_64-apple-darwin/release"
          - label: "macos-universal"
            platform: "macos-latest"
            args: "--target universal-apple-darwin"
            release_dir: "target/universal-apple-darwin/release"
          - label: "ubuntu-22.04"
            platform: "ubuntu-22.04"
            args: ""
            release_dir: "target/release"
          - label: "ubuntu-24.04-arm"
            platform: "ubuntu-24.04-arm"
            args: ""
            release_dir: "target/release"
          - label: "windows-latest"
            platform: "windows-latest"
            args: ""
            release_dir: "target/release"
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐧 Install system dependencies (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libsoup-3.0-dev javascriptcoregtk-4.1 libjavascriptcoregtk-4.1-dev
          sudo apt-get install -y libnm-dev xdg-utils

      - name: 🦀 Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: 🦀 Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}-${{ matrix.label }}

      - name: 🐹 Go setup
        uses: actions/setup-go@v5
        with:
          go-version-file: sidecars/cockpit-cliproxy/go.mod
          cache-dependency-path: sidecars/cockpit-cliproxy/go.sum

      - name: ⚙️ Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install frontend dependencies
        run: npm install

      - name: 🔄 Sync versions
        run: npm run sync-version

      - name: 🏗️ Build app (unsigned)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          npx tauri build --ci --config src-tauri/tauri.ci.conf.json ${{ matrix.args }}

      - name: 📦 Collect installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find "${{ matrix.release_dir }}/bundle" -maxdepth 2 -type f \
            \( -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.msi' -o -name '*-setup.exe' \) \
            -exec cp {} release-assets/ \;
          ls -la release-assets
          test -n "$(ls -A release-assets)"

      - name: 📤 Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.label }}
          retention-days: 3
          if-no-files-found: error
          path: release-assets/*

  publish:
    name: "🚀 Publish release"
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: 📥 Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release-assets
          merge-multiple: true

      - name: 🔗 Generate SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          ls -la
          sha256sum -- * > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - name: 🚀 Create public release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "Release ${TAG} already exists; refusing to overwrite. Push a new tag with a higher suffix."
            exit 1
          fi
          {
            echo "自用构建，基于上游 Cockpit Tools v${VERSION}，提交 \`${GITHUB_SHA}\`。"
            echo
            echo "- 安装包未签名，应用内自动更新不可用，请手动下载新版本安装。"
            echo "- macOS 首次打开如被 Gatekeeper 拦截，请在「系统设置 → 隐私与安全性」中允许。"
            echo "- 校验和见 SHA256SUMS.txt。"
          } > release-notes.md
          gh release create "${TAG}" \
            --verify-tag \
            --title "Cockpit Tools v${VERSION} (${TAG})" \
            --notes-file release-notes.md \
            --latest \
            release-assets/* SHA256SUMS.txt
